services:
  openai-image-relay:
    image: ghcr.io/yilin101/openai-image-relay:latest
    container_name: openai-image-relay
    restart: unless-stopped
    env_file: [.env]
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 256m
    init: true
    networks:
      - new_api_network

networks:
  new_api_network:
    external: true
    name: newapi_new-api-network
